const VERDICT_ICONS = {
  good: '<path d="M5 13l4 4L19 7"/>',
  warn: '<path d="M12 4 3 19h18L12 4Z"/><path d="M12 10v4"/><circle cx="12" cy="16.6" r="0.6" fill="currentColor" stroke="none"/>',
  bad: '<circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.2v.1"/>'
};

function renderForecastVerdict(c){
  if(!c || c.kind !== 'household-forecast' || c.requiredIncome === null) return '';
  let cls = 'verdict-good', icon = 'good', label = 'On track', text = '';
  if(!c.bridgeGapExists){
    text = `Your target income of ${formatGBP(c.requiredIncome)}/yr net (after tax) is projected to be met from age ${c.incomeNeedStartAge}.`;
  } else if(c.bridgeFullyCoveredBySavings){
    cls = 'verdict-warn'; icon = 'warn'; label = 'Gap, but bridged';
    text = `There's a projected net income gap before every pension is fully in payment — but your savings, growing at an illustrative ${SAVINGS_GROWTH_RATE}%/yr, are projected to be enough to bridge it.`;
  } else {
    cls = 'verdict-bad'; icon = 'bad'; label = 'Shortfall projected';
    text = `There's a projected net income shortfall of around ${formatGBP(c.firstUnmetShortfallAmount)}/yr from age ${c.firstUnmetShortfallAge} that your savings don't fully cover.`;
  }
  return `<div class="verdict-banner ${cls}">
    <span class="verdict-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${VERDICT_ICONS[icon]}</svg></span>
    <span class="verdict-text"><span class="verdict-label">${label}</span>${text}</span>
  </div>`;
}

// A row of headline "stat tile" figures above the detailed breakdown — the
// numbers someone would want at a glance: their net target, what they're
// projected to actually have once everything is in payment, and the earliest
// retirement age their own figures support (where a target was given).
function renderForecastStatTiles(c){
  if(!c || c.kind !== 'household-forecast') return '';
  const tiles = [];

  if(c.requiredIncome !== null){
    tiles.push(`
      <div class="stat-tile stat-accent">
        <span class="stat-label">Net target</span>
        <span class="stat-value">${formatGBP(c.requiredIncome)}</span>
        <span class="stat-sub">per year, after tax</span>
      </div>
    `);
  }

  const steadyCls = (c.requiredIncome === null || c.steadyStateIncome >= c.requiredIncome - 0.5) ? 'stat-good' : 'stat-bad';
  tiles.push(`
    <div class="stat-tile ${steadyCls}">
      <span class="stat-label">Steady-state income</span>
      <span class="stat-value">${formatGBP(c.steadyStateIncome)}</span>
      <span class="stat-sub">net, from age ${c.steadyStateAge}</span>
    </div>
  `);

  if(c.requiredIncome !== null){
    let gapCls = 'stat-good', gapLabel = 'No gap';
    if(c.bridgeGapExists && c.bridgeFullyCoveredBySavings){ gapCls = 'stat-warn'; gapLabel = 'Bridged by savings'; }
    else if(c.bridgeGapExists && !c.bridgeFullyCoveredBySavings){ gapCls = 'stat-bad'; gapLabel = `${formatGBP(c.firstUnmetShortfallAmount)}/yr short`; }
    tiles.push(`
      <div class="stat-tile ${gapCls}">
        <span class="stat-label">Income gap check</span>
        <span class="stat-value" style="font-size:18px;">${gapLabel}</span>
        <span class="stat-sub">from age ${c.incomeNeedStartAge}</span>
      </div>
    `);
  }

  const achievableAges = (c.calculatedRetirementAges || []).filter(a => a && a.achievable === true);
  if(achievableAges.length){
    const ageText = achievableAges.length > 1
      ? achievableAges.map((a,i) => `${personLabel(c.calculatedRetirementAges.indexOf(a))}: ${a.age}`).join(' · ')
      : `Age ${achievableAges[0].age}`;
    tiles.push(`
      <div class="stat-tile">
        <span class="stat-label">Earliest sustainable retirement</span>
        <span class="stat-value" style="font-size:18px;">${ageText}</span>
        <span class="stat-sub">calculated, meets net target</span>
      </div>
    `);
  }

  return `<div class="stat-grid">${tiles.join('')}</div>`;
}

function renderCalcPanel(){
  const c = state.calcResults;
  if(!c) return "";

  let rows = "";
  let footnote = "";

  if(c.kind === "tax-relief"){
    rows += `<div class="calc-row"><span class="calc-label">Estimated tax band</span><span class="calc-value">${c.bandName} (${c.bandRate}%)</span></div>`;
    if(c.method === "netpay"){
      rows += `<div class="calc-row"><span class="calc-label">Contribution</span><span class="calc-value">${formatGBP(c.netContribution)}/yr</span></div>`;
      rows += `<div class="calc-row"><span class="calc-label">Relief already applied</span><span class="calc-value">Full relief at ${c.bandRate}%, automatically</span></div>`;
    } else {
      rows += `<div class="calc-row"><span class="calc-label">You pay in</span><span class="calc-value">${formatGBP(c.netContribution)}/yr</span></div>`;
      rows += `<div class="calc-row"><span class="calc-label">Grossed-up contribution</span><span class="calc-value">${formatGBP(c.grossContribution)}/yr</span></div>`;
      rows += `<div class="calc-row"><span class="calc-label">Basic-rate relief added at source</span><span class="calc-value">${formatGBP(c.basicReliefAdded)}/yr</span></div>`;
      rows += `<div class="calc-row"><span class="calc-label">Extra relief you may need to claim</span><span class="calc-value">${formatGBP(c.extraReliefClaimable)}/yr</span></div>`;
    }
    footnote = `Based on illustrative ${c.isRUK ? "rest-of-UK" : "Scottish"} income tax bands for a recent tax year — bands change every April, so confirm current thresholds at gov.uk or gov.scot.`;
    if(c.taperNote) footnote += " Income between £100,000 and £125,140 also sits in the personal allowance taper zone, which your guidance below explains.";
  }

  if(c.kind === "pot-projection"){
    c.results.forEach(r => {
      rows += `<div class="calc-row"><span class="calc-label">${r.label} growth (${r.rate}%/yr)</span><span class="calc-value">${formatGBP(r.value)}</span></div>`;
    });
    rows += `<div class="calc-row"><span class="calc-label">Estimated tax-free lump sum (25%)</span><span class="calc-value">${formatGBP(c.lumpSumEstimate)}</span></div>`;
    footnote = `Illustrative only, over ${c.years} years — not a forecast or guarantee. The lump sum is capped against a current illustrative allowance of ${formatGBP(PENSION_LUMP_SUM_ALLOWANCE)}, which can change.`;
  }

  if(c.kind === "ni-years"){
    rows += `<div class="calc-row"><span class="calc-label">Qualifying years so far</span><span class="calc-value">${c.soFar}</span></div>`;
    rows += `<div class="calc-row"><span class="calc-label">Expected years still to add</span><span class="calc-value">${c.left}</span></div>`;
    rows += `<div class="calc-row"><span class="calc-label">Projected total qualifying years</span><span class="calc-value">${c.projected} (of a typical 35 needed for the full rate)</span></div>`;
    footnote = `A minimum of around 10 qualifying years is usually needed for any new State Pension at all. Get your exact personalised forecast at GOV.UK's "Check your State Pension forecast" service.`;
  }

  if(c.kind === "household-forecast"){
    rows += `<div class="calc-section-label">Household</div>`;
    rows += `<div class="calc-row"><span class="calc-label">Household type</span><span class="calc-value">${c.householdType} (${c.numPeople} ${c.numPeople===1?'person':'people'})</span></div>`;

    c.personResults.forEach((pr, idx) => {
      rows += `<div class="calc-section-label">${personLabel(idx)}'s pensions (gross, before tax)</div>`;
      if(!pr.pensionInfo.pensions.length){
        rows += `<div class="calc-row"><span class="calc-label">Pensions</span><span class="calc-value">None added</span></div>`;
      } else {
        pr.pensionInfo.pensions.forEach(pen => {
          let label, val;
          if(pen.type === 'dc'){
            label = 'Defined contribution';
            val = `${formatGBP(pen.potAtRetirement)} pot${pen.lumpSum>0.5 ? ' → ' + formatGBP(pen.lumpSum) + ' lump sum + ' + formatGBP(pen.annualIncome) + '/yr' : ' → ' + formatGBP(pen.annualIncome) + '/yr (no lump sum taken)'} from age ${pen.incomeStartAge}`;
          } else if(pen.type === 'police'){
            const schemeMix = pen.hybrid ? 'legacy 2006 + 2015 CARE' : (pen.legacyYears > 0 ? '2006 scheme' : '2015 CARE scheme');
            label = `Police pension (${schemeMix}, ${pen.rank})`;
            val = `${formatGBP(pen.annualIncome)}/yr from age ${pen.incomeStartAge}${pen.lumpSum>0.5 ? ' + ' + formatGBP(pen.lumpSum) + ' lump sum' : ''}${pen.isDeferred ? ' (deferred)' : ''}`;
          } else {
            label = pen.type==='db' ? 'Defined benefit' : 'Already in payment';
            val = `${formatGBP(pen.annualIncome)}/yr from age ${pen.incomeStartAge}`;
          }
          rows += `<div class="calc-row"><span class="calc-label">${label}</span><span class="calc-value">${val}</span></div>`;
          if(pen.type === 'police' && pen.hybrid){
            rows += `<div class="calc-row"><span class="calc-label">— legacy portion (${pen.legacyYears.toFixed(1)} yrs)</span><span class="calc-value">${formatGBP(pen.legacyPension)}/yr</span></div>`;
            rows += `<div class="calc-row"><span class="calc-label">— 2015 CARE portion (${pen.careYears.toFixed(1)} yrs)</span><span class="calc-value">${formatGBP(pen.carePension)}/yr</span></div>`;
          }
        });
      }
      rows += `<div class="calc-row"><span class="calc-label">State Pension</span><span class="calc-value">${formatGBP(pr.spInfo.amount)}/yr from age ${pr.spInfo.spa === null ? '—' : pr.spInfo.spa}</span></div>`;
    });

    rows += `<div class="calc-section-label">Savings</div>`;
    rows += `<div class="calc-row"><span class="calc-label">Projected balance at age ${c.incomeNeedStartAge}</span><span class="calc-value">${formatGBP(c.savingsProjection.balanceAtStart)}</span></div>`;

    rows += `<div class="calc-section-label">Income vs. target (net, after tax)</div>`;
    if(c.requiredIncome !== null) rows += `<div class="calc-row"><span class="calc-label">Target household income (net)</span><span class="calc-value">${formatGBP(c.requiredIncome)}/yr</span></div>`;
    c.phases.forEach(ph => {
      const shortfallNote = (c.requiredIncome !== null && ph.shortfall > 0.5) ? ` (shortfall ${formatGBP(ph.shortfall)})` : '';
      const savingsNote = (ph.savingsUsed > 0.5) ? ` — ${formatGBP(ph.savingsUsed)}/yr drawn from savings` : '';
      rows += `<div class="calc-row"><span class="calc-label">From age ${ph.startAge}</span><span class="calc-value">${formatGBP(ph.totalIncome)}/yr net${shortfallNote}${savingsNote}<br><span class="calc-subvalue">${formatGBP(ph.grossIncome)}/yr before tax − ${formatGBP(ph.taxDue)}/yr est. Income Tax</span></span></div>`;
    });
    rows += `<div class="calc-row calc-total"><span class="calc-label">Steady state from age ${c.steadyStateAge}</span><span class="calc-value">${formatGBP(c.steadyStateIncome)}/yr net<br><span class="calc-subvalue">${formatGBP(c.steadyStateGrossIncome)}/yr before tax − ${formatGBP(c.steadyStateTax)}/yr est. Income Tax</span></span></div>`;

    if(c.requiredIncome !== null){
      let gapNote;
      if(!c.bridgeGapExists){
        gapNote = "No income gap — pensions, State Pension and savings meet the target throughout.";
      } else if(c.bridgeFullyCoveredBySavings){
        gapNote = "There's a gap before every income source is in payment, but savings are projected to bridge it in full.";
      } else {
        gapNote = `Savings do NOT fully bridge the gap — a shortfall of around ${formatGBP(c.firstUnmetShortfallAmount)}/yr is projected from age ${c.firstUnmetShortfallAge}, once savings run out.`;
      }
      rows += `<div class="calc-row calc-total"><span class="calc-label">Savings-bridged gap check</span><span class="calc-value">${gapNote}</span></div>`;

      rows += `<div class="calc-section-label">Calculated retirement age</div>`;
      (c.calculatedRetirementAges || []).forEach((calc, idx) => {
        let val;
        if(!calc || calc.achievable === null){
          val = "Not enough information to calculate";
        } else if(calc.achievable === true){
          val = `Age ${calc.age} — the earliest age income sustainably meets the ${formatGBP(c.requiredIncome)}/yr target`;
        } else {
          val = `Not achievable by age ${RETIREMENT_AGE_SEARCH_CAP} on current figures — the target income isn't projected to be sustainably met at any retirement age tried`;
        }
        rows += `<div class="calc-row"><span class="calc-label">${personLabel(idx)}</span><span class="calc-value">${val}</span></div>`;
      });
    }

    footnote = `Each pension figure above is shown gross (before tax) — what that pension itself pays out. The "Income vs. target" figures below are different: they're net, after deducting estimated Scottish Income Tax on each person's own combined taxable income (their pensions plus their own State Pension, once each is in payment, taxed per person as HMRC and Revenue Scotland actually do it — not simply as a flat rate on the household total), including the £100,000–£125,140 personal allowance taper where relevant. Tax-free elements — a 25% pension lump sum, and money drawn from savings — are never taxed again. Uses recognised but illustrative assumptions: ${GROWTH_SCENARIOS[1].rate}% pension growth, the ${SUSTAINABLE_WITHDRAWAL_RATE}% drawdown rule, ${SAVINGS_GROWTH_RATE}% savings growth, current tax-year Scottish Income Tax bands, and State Pension ages estimated from current UK legislation (defined benefit figures use what you entered directly). None of this is a guarantee — check your own scheme paperwork and your GOV.UK State Pension forecast for exact figures.`;

    const hasPoliceLegacy = c.personResults.some(pr => (pr.pensionInfo.pensions||[]).some(pen => pen.type==='police' && pen.legacyYears > 0));
    const hasPoliceCare = c.personResults.some(pr => (pr.pensionInfo.pensions||[]).some(pen => pen.type==='police' && pen.careYears > 0));
    if(hasPoliceLegacy || hasPoliceCare){
      footnote += ` Police pension figures correctly reflect the McCloud remedy: service before 1 April 2015 accrues under the legacy scheme (1/70th per year, capped at 35 years, with an automatic 4× lump sum, and the final-salary link preserved through to actual retirement); service from 1 April 2015 to 31 March 2022 ("remedy period") is valued under a deferred choice underpin — whichever of legacy or 2015 CARE treatment gives the larger benefit for those years — and service from 1 April 2022 onward is mandatory 2015 CARE accrual (1/55.3 of pensionable pay each year, normal pension age 60, reduced by roughly 5% per year if drawn between 55 and 60). All figures use illustrative Police Scotland rank pay scales rather than actual pensionable pay, and the optional £12-for-£1 CARE lump-sum commutation isn't modelled. Get an official Remediable Service Statement and pension estimate from SPPA (pensions.gov.scot) for exact figures.`;
    }
  }

  if(!rows) return "";

  return `
    <div class="calc-panel">
      <h4>Your numbers</h4>
      ${rows}
      <p class="calc-footnote">${footnote}</p>
    </div>
  `;
}

function renderForecastRecapGroup(fd){
  const rows = [];
  rows.push(`<div class="recap-row"><span class="recap-label">Household type</span><span class="recap-value">${escapeHtml(fd.householdType||'—')}</span></div>`);
  fd.people.forEach((p,idx) => {
    const derivedAge = ageFromDOB(p.dateOfBirth);
    rows.push(`<div class="recap-row"><span class="recap-label">${personLabel(idx)} — date of birth / target retirement</span><span class="recap-value">${escapeHtml(p.dateOfBirth||'—')}${derivedAge!==null ? ' (age '+derivedAge+')' : ''} / ${escapeHtml(p.targetRetirementAge||'—')}</span></div>`);
    (p.pensions||[]).forEach(pen => {
      const label = pen.type==='dc' ? 'DC pension' : pen.type==='db' ? 'DB pension' : pen.type==='police' ? 'Police/public sector pension' : 'In-payment pension';
      let value;
      if(pen.type==='dc') value = pen.currentValue||'—';
      else if(pen.type==='db') value = pen.annualIncome||'—';
      else if(pen.type==='police') value = `${pen.rank||'—'}, joined ${pen.policeJoinYear||'—'}`;
      else value = pen.annualIncomeNow||'—';
      rows.push(`<div class="recap-row"><span class="recap-label">${personLabel(idx)} — ${label}</span><span class="recap-value">${escapeHtml(value)}</span></div>`);
    });
    rows.push(`<div class="recap-row"><span class="recap-label">${personLabel(idx)} — NI years so far</span><span class="recap-value">${escapeHtml(p.niYearsSoFar||'—')}</span></div>`);
  });
  rows.push(`<div class="recap-row"><span class="recap-label">Savings now / monthly</span><span class="recap-value">${escapeHtml(fd.savings.currentSavings||'—')} / ${escapeHtml(fd.savings.monthlyContribution||'—')}</span></div>`);
  rows.push(`<div class="recap-row"><span class="recap-label">Target annual income</span><span class="recap-value">${escapeHtml(fd.annualRequiredIncome||'—')}</span></div>`);
  return `<div class="recap-group"><h5>Full pension forecast (household)</h5>${rows.join('')}</div>`;
}

function renderFullRecap(profile, fd){
  const forecastGroup = fd ? renderForecastRecapGroup(fd) : '';
  const groups = MODULES.map(mod => {
    const rowsHtml = mod.questions
      .filter(q => profile[q.id] && String(profile[q.id]).trim().length > 0)
      .map(q => `<div class="recap-row"><span class="recap-label">${escapeHtml(q.label)}</span><span class="recap-value">${escapeHtml(profile[q.id])}</span></div>`)
      .join("");
    if(!rowsHtml) return "";
    return `<div class="recap-group"><h5>${escapeHtml(mod.title)}</h5>${rowsHtml}</div>`;
  }).join("");

  const combined = forecastGroup + groups;
  if(!combined) return "";

  return `
    <details class="recap">
      <summary>Full recap of everything you've told CAS</summary>
      ${combined}
    </details>
  `;
}

function render(){
  const app = document.getElementById('app');
  let html = "";
  if(state.screen === "home") html = renderHome();
  else if(state.screen === "question") html = renderQuestion();
  else if(state.screen === "forecast") html = renderForecastScreen();
  else if(state.screen === "loading") html = renderLoading();
  else if(state.screen === "advice") html = renderAdvice();
  else if(state.screen === "error") html = renderError();
  app.innerHTML = html;
  attachHandlers();

  if(state.screen !== "home"){
    const card = app.querySelector('.card');
    if(card) card.focus();
  }
}

function attachHandlers(){
  if(state.screen === "home"){
    document.querySelectorAll('[data-module]').forEach(row => {
      row.addEventListener('click', () => {
        const mod = MODULES.find(m => m.id === row.dataset.module);
        if(mod.id === "forecast"){
          setState({ screen:"forecast", module:mod, forecastStepIndex:0, pensionDraft: makeEmptyPensionDraft(), calcResults:null, wellbeingFlag:false, scamFlag:false });
        } else {
          setState({ screen:"question", module:mod, qIndex:0, calcResults:null, wellbeingFlag:false, scamFlag:false });
        }
      });
    });
    const resetBtn = document.getElementById('reset-all-btn');
    if(resetBtn) resetBtn.addEventListener('click', () => {
      setState({
        answers:{}, forecastData: makeEmptyForecastData(), forecastStepIndex:0, pensionDraft: makeEmptyPensionDraft(),
        calcResults:null, wellbeingFlag:false, scamFlag:false
      });
    });
  }

  if(state.screen === "question"){
    const q = state.module.questions[state.qIndex];

    if(q.type === "select"){
      document.querySelectorAll('.option-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const answers = Object.assign({}, state.answers, { [q.id]: btn.dataset.option });
          setState({ answers });
        });
      });
    } else {
      const input = document.getElementById('text-input');
      input.addEventListener('input', () => {
        state.answers[q.id] = input.value;
        const btn = document.getElementById('continue-btn');
        if(btn) btn.disabled = false;
      });
    }

    document.getElementById('back-btn').addEventListener('click', () => {
      if(state.qIndex === 0){
        setState({ screen:"home" });
      } else {
        setState({ qIndex: state.qIndex - 1 });
      }
    });

    document.getElementById('continue-btn').addEventListener('click', () => {
      const isLast = state.qIndex === state.module.questions.length - 1;
      if(isLast){
        setState({ screen:"loading" });
        fetchAdvice();
      } else {
        setState({ qIndex: state.qIndex + 1 });
      }
    });
  }

  if(state.screen === "forecast"){
    attachForecastHandlers();
  }

  if(state.screen === "advice" || state.screen === "error"){
    const homeBtn = document.getElementById('home-btn');
    if(homeBtn) homeBtn.addEventListener('click', () => setState({ screen:"home" }));

    const restartBtn = document.getElementById('restart-btn');
    if(restartBtn) restartBtn.addEventListener('click', () => {
      if(state.module && state.module.id === "forecast"){
        setState({ screen:"forecast", forecastStepIndex:0, pensionDraft: makeEmptyPensionDraft(), calcResults:null, wellbeingFlag:false, scamFlag:false });
      } else {
        setState({ screen:"question", qIndex:0, calcResults:null, wellbeingFlag:false, scamFlag:false });
      }
    });

    const retryBtn = document.getElementById('retry-btn');
    if(retryBtn) retryBtn.addEventListener('click', () => {
      if(state.module && state.module.id === "forecast"){
        const result = computeHouseholdForecast(state.forecastData);
        if(!result){
          setState({ screen:"forecast", forecastStepIndex:0 });
          return;
        }
        setState({ screen:"loading" });
        fetchForecastAdvice(result);
      } else {
        setState({ screen:"loading" });
        fetchAdvice();
      }
    });
  }
}

function simpleMarkdownToHtml(text){
  const lines = text.split("\n");
  let html = "";
  let inList = false;

  function closeList(){
    if(inList){ html += "</ul>"; inList = false; }
  }

  lines.forEach(rawLine => {
    const line = rawLine.trim();
    if(line === ""){ closeList(); return; }

    if(line.startsWith("## ")){
      closeList();
      html += `<h2>${inlineFormat(line.slice(3))}</h2>`;
    } else if(line.startsWith("- ")){
      if(!inList){ html += "<ul>"; inList = true; }
      html += `<li>${inlineFormat(line.slice(2))}</li>`;
    } else {
      closeList();
      html += `<p>${inlineFormat(line)}</p>`;
    }
  });
  closeList();
  return html;
}

function inlineFormat(str){
  return escapeHtml(str)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
}

// Reads the response body as text first, then tries to parse it as JSON.
// Never throws — callers get { json, raw }, with json === null if parsing failed.
async function readBodySafely(response){
  const raw = await response.text();
  try{
    return { json: raw ? JSON.parse(raw) : null, raw };
  } catch(parseErr){
    return { json: null, raw };
  }
}

// Pulls a human-readable message out of an Anthropic-style error body
// ({ error: { type, message } }), falling back to the raw text.
function extractErrorMessage(status, body){
  if(body.json && body.json.error && body.json.error.message){
    return `${body.json.error.message} (status ${status})`;
  }
  const snippet = (body.raw || "").slice(0, 200);
  return snippet
    ? `Server returned status ${status}: ${snippet}`
    : `Server returned status ${status} with no message body.`;
}

function computeCalcResults(moduleId, answers){
  if(moduleId === "tax-relief") return computeTaxRelief(answers);
  if(moduleId === "pot-projection") return computePotProjection(answers);
  if(moduleId === "state-pension") return computeNIYears(answers);
  return null;
}

function calcResultsToFactLines(calcResults){
  if(!calcResults) return [];
  const lines = [];

  if(calcResults.kind === "tax-relief"){
    lines.push(`CALCULATED — estimated marginal tax band: ${calcResults.bandName} (${calcResults.bandRate}%), based on ${calcResults.isRUK ? "rest-of-UK" : "Scottish"} bands`);
    if(calcResults.method === "netpay"){
      lines.push(`CALCULATED — contribution method is net pay or salary sacrifice, so full relief at ${calcResults.bandRate}% is already applied automatically`);
    } else {
      lines.push(`CALCULATED — net contribution paid: ${formatGBP(calcResults.netContribution)}/yr, grossed-up contribution: ${formatGBP(calcResults.grossContribution)}/yr`);
      lines.push(`CALCULATED — basic-rate relief added at source: ${formatGBP(calcResults.basicReliefAdded)}/yr`);
      lines.push(`CALCULATED — additional relief potentially reclaimable via Self Assessment: ${formatGBP(calcResults.extraReliefClaimable)}/yr`);
      if(calcResults.starterBonus) lines.push("CALCULATED — this person is a Scottish starter-rate (19%) taxpayer, so they keep the full 20% relief at source with no clawback");
    }
    if(calcResults.taperNote) lines.push("CALCULATED — income falls within the £100,000–£125,140 personal allowance taper zone");
  }

  if(calcResults.kind === "pot-projection"){
    calcResults.results.forEach(r => {
      lines.push(`CALCULATED — ${r.label} scenario (${r.rate}%/yr growth) over ${calcResults.years} years: ${formatGBP(r.value)}`);
    });
    lines.push(`CALCULATED — estimated 25% tax-free lump sum (capped at illustrative allowance): ${formatGBP(calcResults.lumpSumEstimate)}`);
  }

  if(calcResults.kind === "ni-years"){
    lines.push(`CALCULATED — qualifying NI years so far: ${calcResults.soFar}, expected further years: ${calcResults.left}, projected total: ${calcResults.projected} (capped reference of 35 for full rate)`);
  }

  if(calcResults.kind === "household-forecast"){
    lines.push(`CALCULATED — household type: ${calcResults.householdType} (${calcResults.numPeople} ${calcResults.numPeople===1?'person':'people'})`);
    calcResults.personResults.forEach((pr, idx) => {
      const who = personLabel(idx);
      lines.push(`CALCULATED — ${who}: current age ${pr.currentAge === null ? 'not given' : pr.currentAge}, target retirement age ${pr.retireAge === null ? 'not given' : pr.retireAge}`);
      (pr.pensionInfo.pensions||[]).forEach(pen => {
        if(pen.type === "dc") lines.push(`CALCULATED — ${who}'s defined contribution pension: projected pot ${formatGBP(pen.potAtRetirement)} at retirement${pen.lumpSum>0.5 ? `, taking a 25% tax-free lump sum of ${formatGBP(pen.lumpSum)}` : ', not taking a tax-free lump sum (full pot left invested for income)'}, illustrative drawdown income ${formatGBP(pen.annualIncome)}/yr GROSS (before tax) from age ${pen.incomeStartAge}`);
        if(pen.type === "db") lines.push(`CALCULATED — ${who}'s defined benefit pension: ${formatGBP(pen.annualIncome)}/yr GROSS (before tax) from age ${pen.incomeStartAge}`);
        if(pen.type === "inpayment") lines.push(`CALCULATED — ${who}'s pension already in payment: ${formatGBP(pen.annualIncome)}/yr GROSS (before tax), ongoing`);
        if(pen.type === "police"){
          const breakdown = pen.hybrid
            ? `legacy 2006 scheme for ${pen.legacyYears.toFixed(1)} years (${formatGBP(pen.legacyPension)}/yr) plus 2015 CARE for ${pen.careYears.toFixed(1)} years (${formatGBP(pen.carePension)}/yr${pen.careReductionFactor < 1 ? ', reduced for early payment' : ''})`
            : (pen.legacyYears > 0
                ? `legacy 2006 final-salary scheme only, ${pen.legacyYears.toFixed(1)} qualifying years`
                : `2015 CARE scheme only, ${pen.careYears.toFixed(1)} qualifying years${pen.careReductionFactor < 1 ? ', reduced for early payment before age 60' : ''}`);
          lines.push(`CALCULATED — ${who}'s Police Scotland pension (McCloud remedy applied: ${breakdown}, rank ${pen.rank}): ${formatGBP(pen.annualIncome)}/yr GROSS (before tax) total from age ${pen.incomeStartAge}${pen.lumpSum>0.5 ? ', plus an automatic lump sum of ' + formatGBP(pen.lumpSum) + ' from the legacy portion' : ''}${pen.isDeferred ? ' — this is a deferred pension since the given retirement age is before the earliest normal pension age of 55' : ''}`);
        }
      });
      if(!pr.pensionInfo.pensions.length) lines.push(`CALCULATED — ${who} has no private pensions on record`);
      lines.push(`CALCULATED — ${who}'s State Pension: ${formatGBP(pr.spInfo.amount)}/yr GROSS (before tax) from age ${pr.spInfo.spa === null ? 'not estimable' : pr.spInfo.spa} (${pr.spInfo.source === 'known' ? "their own checked GOV.UK forecast" : "estimated from qualifying NI years"})`);
    });
    lines.push(`CALCULATED — household savings: ${formatGBP(calcResults.savingsProjection.current)} now, ${formatGBP(calcResults.savingsProjection.monthly)}/mo contribution, projected to grow to ${formatGBP(calcResults.savingsProjection.balanceAtStart)} by age ${calcResults.incomeNeedStartAge}`);
    lines.push(`CALCULATED — target annual household income: ${calcResults.requiredIncome !== null ? formatGBP(calcResults.requiredIncome) + '/yr NET (this is what the person said they want to have to spend, after tax)' : 'not given'}`);
    lines.push(`CALCULATED — income need begins at age ${calcResults.incomeNeedStartAge} (the earliest target retirement age in the household)`);
    lines.push(`CALCULATED — once every pension and State Pension is in payment (from age ${calcResults.steadyStateAge}), total household income is projected to be ${formatGBP(calcResults.steadyStateIncome)}/yr NET, after an estimated ${formatGBP(calcResults.steadyStateTax)}/yr of Income Tax is deducted from ${formatGBP(calcResults.steadyStateGrossIncome)}/yr gross`);
    if(calcResults.requiredIncome !== null){
      if(!calcResults.bridgeGapExists){
        lines.push(`CALCULATED — no projected income gap: household NET income is projected to meet the ${formatGBP(calcResults.requiredIncome)}/yr NET target from age ${calcResults.incomeNeedStartAge} onward`);
      } else if(calcResults.bridgeFullyCoveredBySavings){
        lines.push(`CALCULATED — there is a projected NET income gap before all pensions/State Pension are in payment, but savings are projected to be sufficient to bridge it in full`);
      } else {
        lines.push(`CALCULATED — there is a projected NET income shortfall that savings do NOT fully cover: the first uncovered shortfall is projected at around ${formatGBP(calcResults.firstUnmetShortfallAmount)}/yr from age ${calcResults.firstUnmetShortfallAge}`);
      }
      (calcResults.calculatedRetirementAges || []).forEach((calc, idx) => {
        const who = personLabel(idx);
        if(calc && calc.achievable === true){
          lines.push(`CALCULATED — ${who}'s earliest sustainable retirement age, given the ${formatGBP(calcResults.requiredIncome)}/yr NET household target and everything else held as stated: age ${calc.age} (this is a calculated figure, separate from and not necessarily the same as the target retirement age ${who.toLowerCase()} entered)`);
        } else if(calc && calc.achievable === false){
          lines.push(`CALCULATED — ${who}'s target income does not appear achievable at any retirement age up to ${RETIREMENT_AGE_SEARCH_CAP} with the pensions, savings and State Pension figures given`);
        }
      });
    }
    lines.push(`CALCULATED — every pension and State Pension figure listed above by name is GROSS (before tax); every figure in the phase-by-phase income timeline below, and the target/steady-state/shortfall figures, is NET (after deducting estimated Scottish Income Tax, worked out per person on their own combined taxable income, including the £100,000–£125,140 personal allowance taper where relevant). A 25% pension lump sum and money drawn from savings are tax-free and are not reduced further.`);
    calcResults.phases.forEach(ph => {
      const shortfallText = calcResults.requiredIncome !== null
        ? (ph.shortfall > 0.5 ? `shortfall of ${formatGBP(ph.shortfall)}/yr` + (ph.savingsUsed > 0.5 ? ` (using ${formatGBP(ph.savingsUsed)}/yr of savings)` : '') : 'target met')
        : '';
      lines.push(`CALCULATED — from age ${ph.startAge}: total household income ${formatGBP(ph.totalIncome)}/yr NET (${formatGBP(ph.grossIncome)}/yr gross, ${formatGBP(ph.taxDue)}/yr est. Income Tax)${shortfallText ? ', ' + shortfallText : ''}`);
    });
  }

  return lines;
}

// Gathers any answers the person has already given in OTHER modules, so guidance in
// one area can be informed by what they told CAS elsewhere, without repeating a
// field that this module already asks about itself.
function buildOtherContextLines(currentModule, profile){
  const ownIds = new Set(currentModule.questions.map(q => q.id));
  const seen = new Set();
  const lines = [];

  MODULES.forEach(mod => {
    if(mod.id === currentModule.id) return;
    mod.questions.forEach(q => {
      if(ownIds.has(q.id) || seen.has(q.id)) return;
      const val = profile[q.id];
      if(val && String(val).trim().length > 0){
        lines.push(`OTHER CONTEXT — ${q.label} — ${val}`);
        seen.add(q.id);
      }
    });
  });

  return lines;
}

// ============================================================================
// Built-in (offline) guidance generator — a deterministic, rule-based fallback
// used whenever the AI guidance service can't be reached (e.g. running from a
// plain static host like GitHub Pages, where the app has no API key). It never
// calls out to the network. It reuses the same CALCULATED/OTHER CONTEXT fact
// lines the AI would have received, and produces a plain-English summary from
// fixed templates instead of generated prose — less naturally-written, but
// fully self-contained and always available.
// ============================================================================

function factLineToBullet(line){
  return line.replace(/^CALCULATED — /, "").replace(/^OTHER CONTEXT — /, "").trim();
}

const LOCAL_MODULE_EXPLAINERS = {
  "forecast": "This forecast combines every pension you've added (of whichever type), each person's State Pension from their own State Pension age, and any savings being used to bridge a gap before all income is flowing — against the annual household income you said you'd like. Each individual pension figure in 'Your numbers' above is shown gross, before tax — what that pension itself pays out. The income-vs-target figures are different: they're net, after deducting estimated Scottish Income Tax on each person's own combined taxable income (worked out per person, the way HMRC and Revenue Scotland actually do it), so they're directly comparable to the take-home target you entered. Figures for defined contribution pots assume balanced (5%/yr) growth, a 25% tax-free lump sum unless you chose to skip it (which stays tax-free either way), and the commonly-cited 4% sustainable drawdown rule. A Police Scotland pension, where present, is worked out across its three legal periods: pre-2015 service under the legacy final-salary scheme, 2015–2022 service resolved by the McCloud 'deferred choice underpin', and service from April 2022 under the mandatory 2015 CARE scheme — exact figures, especially the deferred choice underpin outcome, should be confirmed with SPPA via an official Remediable Service Statement. A calculated retirement age, where shown, is the earliest age your own figures suggest the net target income is sustainably met — a separate, calculated figure from whatever retirement age you actually entered.",
  "fact-find": "A pension adviser typically starts by understanding your whole circumstances — your age relative to when you'd like to retire, your employment status, and anything about your health that might affect either how long your money needs to last or the value of guaranteed income options (a shorter life expectancy can sometimes make an annuity less attractive than drawdown, for instance). Your marital status and existing pensions shape what else is worth reviewing: multiple old workplace pensions are often worth tracking down and consolidating (or at least listing) so nothing gets forgotten, and a spouse or civil partner's own pension position usually needs to be considered alongside yours rather than in isolation.",
  "tax-relief": "Scottish taxpayers get pension tax relief slightly differently from the rest of the UK, because Scotland has its own income tax bands. If your contributions go through a 'net pay' or salary sacrifice arrangement, full relief at your marginal rate happens automatically — there's nothing to claim. If instead your contributions are 'relief at source' (common for personal pensions and many workplace schemes), the pension provider only ever adds relief at the UK basic rate of 20% automatically. A Scottish intermediate, higher, advanced, or top-rate taxpayer has to claim the difference back themselves through Self Assessment — it isn't done for you. A Scottish starter-rate taxpayer is the one exception: they keep the extra 20% relief-at-source top-up with no clawback, even though their income tax rate is below 20%. If your income falls between £100,000 and £125,140, you're in the personal allowance taper zone, where you lose £1 of tax-free personal allowance for every £2 earned above £100,000 — pension contributions are a well-known way to reduce your income for this test and soften the effect.",
  "pot-projection": "A pension pot's eventual size depends on three things: how much time it has to grow, how much goes in, and the investment growth achieved along the way. The three scenarios shown (cautious, balanced, optimistic) aren't predictions — they illustrate how sensitive the outcome is to investment performance, which is genuinely uncertain and outside anyone's control. The 25% tax-free lump sum figure is the amount that could typically be taken free of tax when the pension is first accessed, capped against a current illustrative allowance — the rest of the pot, however it's drawn, is normally taxed as income. How much investment risk suits you depends on how long the money has to grow and how you'd feel about the pot's value falling temporarily, which is a personal question rather than one with a single right answer.",
  "state-pension": "Qualifying National Insurance years build up your entitlement to the new State Pension — currently a maximum of 35 qualifying years is needed for the full amount, with a minimum of around 10 years usually needed to get any State Pension at all. Years short of that can sometimes be filled by paying voluntary Class 3 National Insurance contributions, though whether that's worthwhile depends on your individual circumstances and how many years you're missing. The actual weekly and annual State Pension amount is uprated every April, so rather than quoting a specific figure here, the free 'Check your State Pension forecast' service on GOV.UK gives an exact, personalised figure based on your real record — including any gaps and whether voluntary contributions would fill them cost-effectively.",
  "income-options": "There are three broad ways to take a defined contribution pension in the UK. An annuity converts some or all of the pot into a guaranteed income for life (or a fixed term) — the appeal is certainty, the trade-off is usually a lower total return if you live a long time, and annuity rates vary with interest rates and health. Flexible drawdown keeps the pot invested and lets you draw an income that can vary year to year — more flexible, but the pot (and the income it can sustain) depends on ongoing investment performance and how much is withdrawn. Taking lump sums as needed (sometimes called UFPLS) is similar in spirit but taken irregularly rather than as a regular income. Many people use a mix — some guaranteed income to cover essential costs, with the rest kept flexible. Which mix suits you depends on how much certainty you want, whether you have other income or lump-sum plans, and your own appetite for keeping money invested in retirement.",
  "death-benefits": "In Scotland, most UK pension death benefits are paid at the scheme trustees' discretion, which has two important effects: the money usually sits outside your estate for Inheritance Tax purposes, and it usually sits outside the 'legal rights' that a spouse, civil partner, or children can otherwise claim against your moveable estate under Scots law. An expression of wish (sometimes called a nomination) tells the trustees who you'd like the money to go to — it's a strong steer, but importantly it is not normally legally binding on them, which is exactly why keeping it up to date matters: an old or missing nomination leaves the trustees to decide with less guidance from you. If your circumstances have changed — a new partner, a new child, a separation — it's worth checking your nomination is still what you'd want."
};

// Builds the closing safety/next-steps block used at the end of every local
// summary — mirrors the same rules the AI guidance engine follows, so the
// safety behaviour (Pension Wise/MoneyHelper steer, scam warning signs) is
// never lost just because the online service is unreachable.
function localGuidanceClosing(wellbeingFlag, scamFlag){
  let out = "";
  if(wellbeingFlag){
    out += `\n\n## If things feel difficult right now\nSomething in your answers suggested this might be a worrying or stressful time to be thinking about pensions. That's completely understandable, and you don't have to work through it alone — Pension Wise (free, government-backed, for over-50s) and MoneyHelper both offer free, impartial guidance and are a genuinely good next step before making any decisions.`;
  }
  if(scamFlag){
    out += `\n\n## A note on pension scams\nSomething in your answers has some of the hallmarks of a pension scam approach — a cold contact, pressure to act quickly, promises of guaranteed or unusually high returns, or being told you can access your pension before age 55 are all common warning signs. Please don't feel rushed into any decision. Before doing anything else, check any firm on the FCA Register and use FCA ScamSmart to see if it matches a known scam pattern.`;
  }
  out += `\n\n## Next step\nThis is educational information, not a personal recommendation — for advice tailored to your own circumstances, it's worth discussing the specifics with an FCA-authorised financial adviser.`;
  return out;
}

// The public entry point: builds a full markdown summary with no network call.
function generateLocalGuidance(m, factsLines, calcResults, wellbeingFlag, scamFlag){
  const bullets = factsLines
    .filter(l => !l.startsWith("WELLBEING NOTE") && !l.startsWith("SCAM ALERT NOTE"))
    .map(l => `- ${factLineToBullet(l)}`)
    .join("\n");

  let out = `## Your numbers\n${bullets || "- No figures were given for this module."}`;
  out += `\n\n## What this means\n${LOCAL_MODULE_EXPLAINERS[m.id] || "Here's what your figures mean in general terms."}`;
  out += localGuidanceClosing(wellbeingFlag, scamFlag);
  return out;
}

async function callGuidanceAPI(userMessage){
  let response;
  try{
    response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        system: SYSTEM_PROMPT,
        messages: [ { role: "user", content: userMessage } ]
      })
    });
  } catch(networkErr){
    return { ok:false, errorText: "Couldn't reach the guidance service — check your connection and try again. (" + networkErr.message + ")" };
  }

  const body = await readBodySafely(response);

  if(!response.ok){
    return { ok:false, errorText: extractErrorMessage(response.status, body) };
  }
  if(!body.json){
    return { ok:false, errorText: "The guidance service returned something unexpected: " + (body.raw || "").slice(0, 200) };
  }

  let text = "";
  try{
    const textBlock = (body.json.content || []).find(b => b.type === "text");
    text = textBlock ? textBlock.text : "";
  } catch(shapeErr){
    return { ok:false, errorText: "Couldn't read the guidance response (unexpected shape): " + shapeErr.message };
  }

  if(!text) return { ok:false, errorText: "No guidance came back this time. Please try again." };
  return { ok:true, text };
}

async function fetchAdvice(){
  const m = state.module;
  const factsLines = m.questions.map(q => `${q.label} — ${state.answers[q.id] || "(not answered)"}`);
  const calcResults = computeCalcResults(m.id, state.answers);

  factsLines.push(...calcResultsToFactLines(calcResults));
  factsLines.push(...buildOtherContextLines(m, state.answers));

  const wellbeingFlag = detectKeywordSignal(state.answers, WELLBEING_KEYWORDS);
  const scamFlag = detectKeywordSignal(state.answers, SCAM_KEYWORDS);
  if(wellbeingFlag) factsLines.push("WELLBEING NOTE: something in these answers suggests possible worry, stress, or financial difficulty.");
  if(scamFlag) factsLines.push("SCAM ALERT NOTE: something in these answers has the hallmarks of a pension scam approach.");

  const userMessage = `USER FACTS:\n${factsLines.join("\n")}\n\nMODULE TASK:\n${m.task}`;
  const result = await callGuidanceAPI(userMessage);

  if(!result.ok){
    setState({
      screen: "advice",
      adviceHtml: simpleMarkdownToHtml(generateLocalGuidance(m, factsLines, calcResults, wellbeingFlag, scamFlag)),
      calcResults,
      wellbeingFlag,
      scamFlag,
      usedLocalFallback: true
    });
    return;
  }

  setState({
    screen: "advice",
    adviceHtml: simpleMarkdownToHtml(result.text),
    calcResults,
    wellbeingFlag,
    scamFlag,
    usedLocalFallback: false
  });
}

async function fetchForecastAdvice(calcResults){
  const m = MODULES.find(mod => mod.id === "forecast");
  const factsLines = calcResultsToFactLines(calcResults);
  factsLines.push(...buildOtherContextLines(m, state.answers));

  const wellbeingFlag = detectKeywordSignal(state.answers, WELLBEING_KEYWORDS);
  const scamFlag = detectKeywordSignal(state.answers, SCAM_KEYWORDS);
  if(wellbeingFlag) factsLines.push("WELLBEING NOTE: something in these answers suggests possible worry, stress, or financial difficulty.");
  if(scamFlag) factsLines.push("SCAM ALERT NOTE: something in these answers has the hallmarks of a pension scam approach.");

  const userMessage = `USER FACTS:\n${factsLines.join("\n")}\n\nMODULE TASK:\n${m.task}`;
  const result = await callGuidanceAPI(userMessage);

  if(!result.ok){
    setState({
      screen: "advice",
      module: m,
      adviceHtml: simpleMarkdownToHtml(generateLocalGuidance(m, factsLines, calcResults, wellbeingFlag, scamFlag)),
      calcResults,
      wellbeingFlag,
      scamFlag,
      usedLocalFallback: true
    });
    return;
  }

  setState({
    screen: "advice",
    module: m,
    adviceHtml: simpleMarkdownToHtml(result.text),
    calcResults,
    wellbeingFlag,
    scamFlag,
    usedLocalFallback: false
  });
}
